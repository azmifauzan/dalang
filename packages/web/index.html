<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('dalang.theme');
          var scheme = pref === 'dark' || pref === 'light' ? pref : 'light dark';
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', scheme);
          var isDark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=0.6.1" />
    <title>DALANG · Local CLI Agent Orchestrator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
