    stroke-linecap="round"
  />
  <!-- Stepped pedestal & Cempurit (wayang handle rod) -->
  <path
    class="kayon-line"
    d="M6.5 19H17.5M8.5 21.2H15.5M12 19V22.2"
    stroke-width="1.6"
    stroke-linecap="round"
