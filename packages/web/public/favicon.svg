<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .kayon-body {
      fill: #fdeee6;
      stroke: #9a3412;
    }
    .kayon-line {
      stroke: #9a3412;
    }
    @media (prefers-color-scheme: dark) {
      .kayon-body {
        fill: #3b2416;
        stroke: #e07a38;
      }
      .kayon-line {
        stroke: #e07a38;
      }
    }
  </style>
  <!-- Gunungan (Kayon) outer leaf/mountain silhouette -->
  <path
    class="kayon-body"
    d="M12 2C14.2 5.4 19.2 9.4 19.2 14C19.2 16.4 17.6 18.2 15.6 19H8.4C6.4 18.2 4.8 16.4 4.8 14C4.8 9.4 9.8 5.4 12 2Z"
    stroke-width="1.75"
    stroke-linejoin="round"
  />
  <!-- Gapura (threshold gate) at base of Gunungan -->
  <path
